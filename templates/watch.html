<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fun Footy — Watch Replay</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #1a1a2e;
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .container {
      background: #16213e;
      border-radius: 12px;
      padding: 2.5rem;
      max-width: 420px;
      width: 100%;
      margin: 1rem;
      text-align: center;
    }
    h1 {
      font-size: 1.5rem;
      margin-bottom: 0.5rem;
      color: #fff;
    }
    .match-info {
      color: #8a8a9a;
      margin-bottom: 1.5rem;
      font-size: 0.95rem;
      line-height: 1.5;
    }
    .watch-link {
      display: block;
      padding: 0.75rem;
      border-radius: 6px;
      background: #e94560;
      color: #fff;
      font-size: 1.1rem;
      font-weight: 600;
      text-decoration: none;
      transition: background 0.2s;
      margin-bottom: 1rem;
    }
    .watch-link:hover { background: #c73e54; }
    .back-link {
      color: #8a8a9a;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Your random close finish</h1>
    <div class="match-info">
      {{ game.season }} {{ game.round }}<br>
      {{ game.venue }}
    </div>
    <a class="watch-link" href="{{ replay_url }}" referrerpolicy="no-referrer">Watch Replay</a>
    <a class="back-link" href="/">Pick another</a>
  </div>
</body>
</html>
